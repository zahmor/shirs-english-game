    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;shirs-english-food-game&quot; dir=&quot;rtl&quot;&gt;
  &lt;style&gt;
    #shirs-english-food-game {
      --sheli-ink: light-dark(#24304a, #f7f8ff);
      --sheli-muted: light-dark(#5f6b85, #c6cee2);
      --sheli-bg: light-dark(#fffaf0, #20263a);
      --sheli-surface: light-dark(#ffffff, #2b3248);
      --sheli-soft: light-dark(#eef9ff, #343d58);
      --sheli-line: light-dark(#dbe6f0, #4a5574);
      --sheli-purple: light-dark(#7057d9, #aa98ff);
      --sheli-purple-dark: light-dark(#5740bd, #c5b9ff);
      --sheli-orange: light-dark(#f17839, #ffac73);
      --sheli-green: light-dark(#168568, #62d8b3);
      --sheli-red: light-dark(#c6425a, #ff8da1);
      --sheli-yellow: light-dark(#ffd85f, #f0c84a);
      --sheli-shadow: light-dark(rgba(42, 53, 84, .12), rgba(0, 0, 0, .28));
      color-scheme: light dark;
      color: var(--sheli-ink);
      font-family: &quot;Segoe UI&quot;, Arial, sans-serif;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      position: relative;
      isolation: isolate;
    }

    #shirs-english-food-game * { box-sizing: border-box; }

    #shirs-english-food-game .sheli-app {
      background:
        radial-gradient(circle at 8% 5%, color-mix(in srgb, var(--sheli-yellow) 32%, transparent) 0 80px, transparent 81px),
        radial-gradient(circle at 92% 12%, color-mix(in srgb, var(--sheli-purple) 18%, transparent) 0 110px, transparent 111px),
        var(--sheli-bg);
      border: 1px solid var(--sheli-line);
      border-radius: 28px;
      box-shadow: 0 16px 38px var(--sheli-shadow);
      overflow: hidden;
      min-height: 560px;
    }

    #shirs-english-food-game .sheli-header {
      padding: 20px 22px 14px;
      display: grid;
      gap: 14px;
    }

    #shirs-english-food-game .sheli-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #shirs-english-food-game h1,
    #shirs-english-food-game h2,
    #shirs-english-food-game p { margin: 0; }

    #shirs-english-food-game h1 {
      font-size: clamp(1.55rem, 4vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -.02em;
    }

    #shirs-english-food-game .sheli-name { color: var(--sheli-purple-dark); }

    #shirs-english-food-game .sheli-score {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--sheli-surface);
      border: 1px solid var(--sheli-line);
      border-radius: 999px;
      padding: 9px 13px;
      font-weight: 800;
      box-shadow: 0 4px 12px var(--sheli-shadow);
      white-space: nowrap;
    }

    #shirs-english-food-game .sheli-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
    }

    #shirs-english-food-game .sheli-toolbar .sheli-level-label {
      flex: 1 1 170px;
    }

    #shirs-english-food-game .sheli-level-label {
      display: grid;
      gap: 5px;
      color: var(--sheli-muted);
      font-size: .9rem;
      font-weight: 700;
    }

    #shirs-english-food-game select {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--sheli-line);
      border-radius: 12px;
      background: var(--sheli-surface);
      color: var(--sheli-ink);
      font: inherit;
      font-weight: 700;
    }

    #shirs-english-food-game button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    #shirs-english-food-game button:not(:disabled) { cursor: pointer; }

    #shirs-english-food-game button:focus-visible,
    #shirs-english-food-game select:focus-visible {
      outline: 4px solid color-mix(in srgb, var(--sheli-purple) 40%, transparent);
      outline-offset: 2px;
    }

    #shirs-english-food-game .sheli-sound-toggle {
      min-height: 44px;
      border: 1px solid var(--sheli-line);
      border-radius: 12px;
      padding: 8px 12px;
      background: var(--sheli-surface);
      font-weight: 750;
    }

    #shirs-english-food-game .sheli-speech-status {
      flex-basis: 100%;
      min-height: 1.35em;
      color: var(--sheli-muted);
      font-size: .9rem;
      font-weight: 700;
      text-align: left;
    }

    #shirs-english-food-game .sheli-speech-status.is-error {
      color: var(--sheli-red);
    }

    #shirs-english-food-game .sheli-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 0 22px 16px;
    }

    #shirs-english-food-game .sheli-tab {
      min-height: 52px;
      border: 1px solid var(--sheli-line);
      border-radius: 15px;
      background: var(--sheli-surface);
      font-weight: 800;
      padding: 9px 12px;
      transition: transform .16s ease, background .16s ease, color .16s ease;
    }

    #shirs-english-food-game .sheli-tab[aria-selected=&quot;true&quot;] {
      background: var(--sheli-purple);
      color: light-dark(#fff, #161a28);
      border-color: transparent;
      box-shadow: 0 5px 14px color-mix(in srgb, var(--sheli-purple) 25%, transparent);
    }

    #shirs-english-food-game .sheli-main {
      border-top: 1px solid var(--sheli-line);
      padding: 22px;
      min-height: 395px;
    }

    #shirs-english-food-game .sheli-panel[hidden] { display: none; }

    #shirs-english-food-game .sheli-learn-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, .72fr);
      gap: 20px;
      align-items: stretch;
    }

    #shirs-english-food-game .sheli-word-card {
      background: var(--sheli-surface);
      border: 1px solid var(--sheli-line);
      border-radius: 24px;
      box-shadow: 0 9px 24px var(--sheli-shadow);
      padding: 22px;
      min-height: 300px;
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #shirs-english-food-game .sheli-letter-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      min-width: 52px;
      padding: 6px 9px;
      border-radius: 12px;
      background: var(--sheli-soft);
      color: var(--sheli-purple-dark);
      font-size: 1.05rem;
      font-weight: 900;
      direction: ltr;
    }

    #shirs-english-food-game .sheli-emoji {
      font-size: clamp(5rem, 17vw, 8.5rem);
      line-height: 1;
      filter: drop-shadow(0 7px 7px var(--sheli-shadow));
      user-select: none;
    }

    #shirs-english-food-game .sheli-word {
      direction: ltr;
      font-size: clamp(2rem, 7vw, 3.25rem);
      font-weight: 900;
      color: var(--sheli-purple-dark);
      letter-spacing: .01em;
      margin-top: 12px;
    }

    #shirs-english-food-game .sheli-translation {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--sheli-muted);
      margin-top: 4px;
    }

    #shirs-english-food-game .sheli-side-actions {
      background: color-mix(in srgb, var(--sheli-soft) 72%, transparent);
      border-radius: 22px;
      padding: 18px;
      display: grid;
      align-content: center;
      gap: 12px;
      text-align: center;
    }

    #shirs-english-food-game .sheli-progress-label {
      color: var(--sheli-muted);
      font-weight: 750;
    }

    #shirs-english-food-game .sheli-progress {
      height: 10px;
      background: color-mix(in srgb, var(--sheli-line) 74%, transparent);
      border-radius: 999px;
      overflow: hidden;
    }

    #shirs-english-food-game .sheli-progress &gt; span {
      display: block;
      height: 100%;
      background: var(--sheli-green);
      border-radius: inherit;
      transition: width .25s ease;
    }

    #shirs-english-food-game .sheli-action {
      min-height: 52px;
      border: 1px solid var(--sheli-line);
      border-radius: 15px;
      background: var(--sheli-surface);
      padding: 10px 14px;
      font-weight: 850;
    }

    #shirs-english-food-game .sheli-action-primary {
      background: var(--sheli-purple);
      color: light-dark(#fff, #151a27);
      border-color: transparent;
    }

    #shirs-english-food-game .sheli-action-orange {
      background: var(--sheli-orange);
      color: light-dark(#251306, #221209);
      border-color: transparent;
    }

    #shirs-english-food-game .sheli-action:active,
    #shirs-english-food-game .sheli-choice:active,
    #shirs-english-food-game .sheli-match-item:active { transform: scale(.98); }

    #shirs-english-food-game .sheli-quiz-wrap {
      max-width: 720px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
      text-align: center;
    }

    #shirs-english-food-game .sheli-prompt {
      font-size: 1.18rem;
      font-weight: 850;
    }

    #shirs-english-food-game .sheli-quiz-emoji {
      font-size: clamp(6rem, 22vw, 9.5rem);
      line-height: 1;
      filter: drop-shadow(0 7px 7px var(--sheli-shadow));
    }

    #shirs-english-food-game .sheli-choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
      direction: ltr;
    }

    #shirs-english-food-game .sheli-choice {
      min-height: 62px;
      border: 2px solid var(--sheli-line);
      border-radius: 16px;
      background: var(--sheli-surface);
      font-size: 1.2rem;
      font-weight: 850;
      padding: 10px 12px;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    #shirs-english-food-game .sheli-choice:hover:not(:disabled) {
      border-color: var(--sheli-purple);
      transform: translateY(-2px);
    }

    #shirs-english-food-game .sheli-choice.is-correct {
      border-color: var(--sheli-green);
      background: color-mix(in srgb, var(--sheli-green) 17%, var(--sheli-surface));
    }

    #shirs-english-food-game .sheli-choice.is-wrong {
      border-color: var(--sheli-red);
      background: color-mix(in srgb, var(--sheli-red) 12%, var(--sheli-surface));
      animation: sheli-shake .28s ease;
    }

    #shirs-english-food-game .sheli-feedback {
      min-height: 28px;
      font-weight: 850;
      color: var(--sheli-muted);
    }

    #shirs-english-food-game .sheli-feedback.good { color: var(--sheli-green); }
    #shirs-english-food-game .sheli-feedback.try { color: var(--sheli-red); }

    #shirs-english-food-game .sheli-match-wrap { display: grid; gap: 16px; }

    #shirs-english-food-game .sheli-match-status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--sheli-muted);
      font-weight: 750;
    }

    #shirs-english-food-game .sheli-match-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      direction: ltr;
    }

    #shirs-english-food-game .sheli-match-column {
      display: grid;
      gap: 10px;
    }

    #shirs-english-food-game .sheli-match-item {
      min-height: 64px;
      border: 2px solid var(--sheli-line);
      border-radius: 16px;
      background: var(--sheli-surface);
      padding: 8px 12px;
      font-size: 1.16rem;
      font-weight: 850;
      transition: transform .15s ease, background .15s ease, border-color .15s ease, opacity .2s ease;
    }

    #shirs-english-food-game .sheli-match-item[data-kind=&quot;emoji&quot;] {
      font-size: 2.25rem;
    }

    #shirs-english-food-game .sheli-match-item.is-selected {
      border-color: var(--sheli-orange);
      background: color-mix(in srgb, var(--sheli-orange) 15%, var(--sheli-surface));
      transform: scale(1.025);
    }

    #shirs-english-food-game .sheli-match-item.is-matched {
      border-color: var(--sheli-green);
      background: color-mix(in srgb, var(--sheli-green) 15%, var(--sheli-surface));
      opacity: .58;
    }

    #shirs-english-food-game .sheli-match-item.is-wrong {
      border-color: var(--sheli-red);
      animation: sheli-shake .28s ease;
    }

    #shirs-english-food-game .sheli-finish {
      max-width: 520px;
      margin: 20px auto 0;
      padding: 24px;
      border: 1px solid var(--sheli-line);
      border-radius: 22px;
      background: var(--sheli-surface);
      box-shadow: 0 8px 22px var(--sheli-shadow);
      text-align: center;
      display: grid;
      gap: 13px;
    }

    #shirs-english-food-game .sheli-finish[hidden] { display: none; }
    #shirs-english-food-game .sheli-finish-emoji { font-size: 4rem; }
    #shirs-english-food-game .sheli-finish h2 { font-size: 1.55rem; }

    #shirs-english-food-game .sheli-celebration {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
    }

    #shirs-english-food-game .sheli-celebration.show {
      animation: sheli-pop 900ms ease both;
    }

    #shirs-english-food-game .sheli-celebration span {
      background: var(--sheli-surface);
      border: 2px solid var(--sheli-yellow);
      border-radius: 999px;
      box-shadow: 0 10px 30px var(--sheli-shadow);
      padding: 14px 20px;

      };

      let soundOn = true;

      let activeFoods = selectedItems();
      let learnIndex = 0;
      let quizRound = [];
      let quizIndex = 0;
      let quizCorrect = 0;

      byId(&#x27;sheli-next-word&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
